<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스피드 퀴즈 (50 세트 모바일 가로모드)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .full-screen {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    @media (orientation: portrait) {
      #portrait-warning {
        display: flex !important;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col justify-between overflow-hidden">

  <!-- 세로모드 안내 레이어 -->
  <div id="portrait-warning" class="hidden fixed inset-0 bg-slate-950 z-50 flex-col items-center justify-center p-6 text-center">
    <div class="animate-bounce text-amber-400 text-6xl mb-4">
      <i class="fa-solid fa-rotate-right"></i>
    </div>
    <h2 class="text-2xl font-bold mb-2">화면을 가로로 돌려주세요!</h2>
    <p class="text-slate-400 text-sm">본 게임은 모바일 가로모드에 최적화되어 있습니다.</p>
  </div>

  <div class="full-screen relative overflow-hidden flex flex-col justify-between p-2 sm:p-4">

    <!-- 1. 홈 화면 (게임 선택) -->
    <div id="screen-home" class="flex-1 flex flex-col justify-between h-full">
      <div class="flex justify-between items-center bg-slate-800/80 backdrop-blur rounded-xl px-4 py-2 border border-slate-700/50 shadow-lg shrink-0">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-bolt-lightning text-amber-400 text-xl"></i>
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
            스피드 퀴즈 (50 세트)
          </h1>
        </div>
        
        <div class="flex items-center gap-3">
          <div class="flex items-center bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-700">
            <i class="fa-regular fa-clock text-slate-400 text-xs mr-1.5"></i>
            <span class="text-xs text-slate-400 mr-1 hidden sm:inline">제한시간:</span>
            <select id="time-select" class="bg-transparent text-amber-400 text-xs font-bold focus:outline-none cursor-pointer">
              <option value="60">1분 (60초)</option>
              <option value="90">1.5분 (90초)</option>
              <option value="120" selected>2분 (120초)</option>
              <option value="150">2.5분 (150초)</option>
              <option value="180">3분 (180초)</option>
            </select>
          </div>

          <button onclick="resetProgress()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-600 flex items-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-rotate-left"></i>
            <span class="hidden sm:inline">초기화</span>
          </button>
        </div>
      </div>

      <div class="flex-1 my-2 overflow-y-auto pr-1">
        <div id="set-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2 h-full content-start">
        </div>
      </div>

      <div class="bg-slate-800/80 backdrop-blur rounded-xl p-2 sm:p-3 border border-slate-700/50 flex items-center justify-between shrink-0">
        <div class="text-xs sm:text-sm text-slate-300">
          선택된 게임: <span id="selected-set-label" class="text-amber-400 font-bold text-base ml-1">1번 세트</span>
          <span class="text-slate-500 ml-2 text-xs hidden sm:inline">(총 30개 단어)</span>
        </div>
        <button id="btn-start" onclick="startCountdown()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-sm sm:text-base px-6 py-2 rounded-lg shadow-lg shadow-amber-500/20 active:scale-95 transition flex items-center gap-2">
          <span>게임 시작!</span>
          <i class="fa-solid fa-play"></i>
        </button>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="screen-countdown" class="hidden absolute inset-0 bg-slate-950/95 z-40 flex-col items-center justify-center">
      <div id="countdown-number" class="text-8xl sm:text-9xl font-black text-amber-400 animate-ping">
        3
      </div>
      <p class="text-slate-400 text-lg sm:text-xl font-semibold mt-6 tracking-wide">준비하세요!</p>
    </div>

    <!-- 3. 메인 게임 화면 -->
    <div id="screen-game" class="hidden flex-1 flex-col justify-between h-full relative">
      <div class="flex justify-between items-center bg-slate-800/90 rounded-xl px-4 py-2 border border-slate-700/60 shadow-md shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-400">진행:</span>
          <span id="game-progress" class="text-sm font-extrabold text-amber-400">1 / 30</span>
        </div>

        <div class="flex items-center gap-2 bg-slate-950/80 px-3 py-1 rounded-lg border border-slate-800">
          <i class="fa-solid fa-stopwatch text-amber-400 animate-pulse text-sm"></i>
          <span id="game-timer" class="text-base sm:text-lg font-black text-amber-400 tracking-wider">02:00</span>
        </div>

        <button onclick="endGame()" class="text-xs bg-slate-700/60 hover:bg-rose-900/50 text-slate-300 hover:text-rose-300 px-2.5 py-1 rounded-md transition border border-slate-600/50">
          종료
        </button>
      </div>

      <div class="flex-1 flex items-center justify-center my-1 relative overflow-hidden bg-slate-950/40 rounded-2xl border border-slate-800/80">
        <div id="word-display" class="font-black text-center tracking-tight text-slate-5 px-4 leading-none transition-all duration-100 drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]" style="font-size: clamp(3.5rem, 18vh, 12rem);">
          단어표시
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 shrink-0 h-16 sm:h-20">
        <button onclick="handlePass()" class="bg-gradient-to-br from-slate-700 to-slate-800 hover:from-slate-600 hover:to-slate-700 active:scale-95 text-slate-200 border border-slate-600 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-xmark text-xl sm:text-2xl text-rose-400"></i>
          <span class="text-lg sm:text-xl font-bold">패스 (X)</span>
        </button>
        <button onclick="handleCorrect()" class="bg-gradient-to-br from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 active:scale-95 text-white border border-emerald-500/50 rounded-xl shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-check text-xl sm:text-2xl text-emerald-200"></i>
          <span class="text-lg sm:text-xl font-extrabold">정답 (O)</span>
        </button>
      </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="hidden flex-1 flex-col justify-between h-full bg-slate-900/95 rounded-2xl border border-slate-800 p-3 sm:p-4">
      <div class="text-center shrink-0">
        <h2 class="text-3xl sm:text-4xl font-black text-amber-400 tracking-wider animate-bounce">
          끝!
        </h2>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">게임이 종료되었습니다.</p>
      </div>

      <div class="flex-1 my-2 flex flex-col sm:flex-row items-center justify-center gap-4 bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 overflow-hidden">
        <div class="flex flex-col items-center justify-center bg-slate-900/80 p-4 rounded-xl border border-amber-500/30 min-w-[140px]">
          <span class="text-slate-400 text-xs font-semibold mb-1">정답 개수</span>
          <div class="flex items-baseline gap-1">
            <span id="result-score" class="text-5xl font-black text-amber-400">0</span>
            <span class="text-slate-500 font-bold text-sm">/ 30</span>
          </div>
        </div>

        <div class="flex-1 h-full w-full overflow-y-auto pr-1 bg-slate-900/40 rounded-lg p-2 border border-slate-800 text-xs">
          <div id="result-word-list" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
          </div>
        </div>
      </div>

      <button onclick="showHomeScreen()" class="shrink-0 w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-base py-3 rounded-xl shadow-lg shadow-amber-500/20 active:scale-98 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-house"></i>
        <span>다음 팀으로 (홈으로 이동)</span>
      </button>
    </div>

  </div>

      ["캐치마인드", "몸으로말해요", "초성퀴즈", "인물퀴즈", "음악퀴즈", "영화퀴즈", "명대사퀴즈", "연속말하기", "신조어퀴즈", "빙고게임", "마피아게임", "라이어게임", "진실게임", "왕게임", "훈민정음", "369게임", "클레오파트라", "딸기게임", "손병호게임", "랜덤게임", "의리게임", "눈치게임", "경마게임", "왕바보게임", "업다운", "베스킨라빈스31", "출석체크", "홍삼게임", "스피드퀴즈", "이순신게임"]

    let currentSetIndex = 0;
    let completedSets = new Set();
    let currentWords = [];
    let currentWordIndex = 0;
    let timerInterval = null;
    let timeLeft = 120;
    let selectedDuration = 120;
    let gameResults = [];

    const screenHome = document.getElementById('screen-home');
    const screenCountdown = document.getElementById('screen-countdown');
    const screenGame = document.getElementById('screen-game');
    const screenResult = document.getElementById('screen-result');
    const setGrid = document.getElementById('set-grid');
    const timeSelect = document.getElementById('time-select');
    const selectedSetLabel = document.getElementById('selected-set-label');
    const countdownNumber = document.getElementById('countdown-number');
    const wordDisplay = document.getElementById('word-display');
    const gameTimer = document.getElementById('game-timer');
    const gameProgress = document.getElementById('game-progress');
    const resultScore = document.getElementById('result-score');
    const resultWordList = document.getElementById('result-word-list');

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      renderSetGrid();
      updateSelectedSetUI();

      timeSelect.addEventListener('change', (e) => {
        selectedDuration = parseInt(e.target.value, 10);
      });
    });

    function loadStorage() {
      const saved = localStorage.getItem('speed_quiz_completed_sets');
      if (saved) {
        try {
          const arr = JSON.parse(saved);
          completedSets = new Set(arr);
        } catch(e) {
          completedSets = new Set();
        }
      }
    }

    function saveStorage() {
      localStorage.setItem('speed_quiz_completed_sets', JSON.stringify(Array.from(completedSets)));
    }

    function resetProgress() {
      if (confirm('완료한 게임 세트 기록을 모두 리셋하시겠습니까?')) {
        completedSets.clear();
        saveStorage();
        renderSetGrid();
      }
    }

    function renderSetGrid() {
      setGrid.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const btn = document.createElement('button');
        const isCompleted = completedSets.has(i);
        const isSelected = i === currentSetIndex;

        let baseClasses = "relative flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs sm:text-sm font-bold transition-all border ";
        
        if (isSelected) {
          baseClasses += "bg-amber-500 text-slate-950 border-amber-300 shadow-md shadow-amber-500/30 scale-105 z-10 ";
        } else if (isCompleted) {
          baseClasses += "bg-slate-800/60 text-slate-500 border-slate-700/50 hover:bg-slate-800 ";
        } else {
          baseClasses += "bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700 hover:border-slate-500 ";
        }

        btn.className = baseClasses;
        btn.innerHTML = `
          <span>${i + 1}</span>
          ${isCompleted ? '<i class="fa-solid fa-check text-[10px] text-emerald-400 absolute top-1 right-1"></i>' : ''}
        `;

        btn.onclick = () => selectSet(i);
        setGrid.appendChild(btn);
      }
    }

    function selectSet(index) {
      currentSetIndex = index;
      renderSetGrid();
      updateSelectedSetUI();
    }

    function updateSelectedSetUI() {
      selectedSetLabel.innerText = `${currentSetIndex + 1}번 세트`;
    }

    function startCountdown() {
      screenHome.classList.add('hidden');
      screenHome.classList.remove('flex');
      screenCountdown.classList.remove('hidden');
      screenCountdown.classList.add('flex');

      let count = 3;
      countdownNumber.innerText = count;

      const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNumber.innerText = count;
        } else if (count === 0) {
          countdownNumber.innerText = "시작!";
        } else {
          clearInterval(countInterval);
          screenCountdown.classList.add('hidden');
          screenCountdown.classList.remove('flex');
          runGame();
        }
      }, 900);
    }

    function runGame() {
      screenGame.classList.remove('hidden');
      screenGame.classList.add('flex');

      currentWords = [...GAME_SETS[currentSetIndex]];
      currentWordIndex = 0;
      gameResults = [];
      timeLeft = selectedDuration;

      updateTimerUI();
      showNextWord();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const sec = String(timeLeft % 60).padStart(2, '0');
      gameTimer.innerText = `${min}:${sec}`;

      if (timeLeft <= 10) {
        gameTimer.classList.add('text-rose-500');
        gameTimer.classList.remove('text-amber-400');
      } else {
        gameTimer.classList.remove('text-rose-500');
        gameTimer.classList.add('text-amber-400');
      }
    }

    function showNextWord() {
      if (currentWordIndex >= currentWords.length) {
        endGame();
        return;
      }

      const word = currentWords[currentWordIndex];
      wordDisplay.innerText = word;
      gameProgress.innerText = `${currentWordIndex + 1} / ${currentWords.length}`;

      if (word.length <= 3) {
        wordDisplay.style.fontSize = "clamp(4.5rem, 24vh, 14rem)";
      } else if (word.length <= 5) {
        wordDisplay.style.fontSize = "clamp(3.5rem, 18vh, 10rem)";
      } else if (word.length <= 7) {
        wordDisplay.style.fontSize = "clamp(2.5rem, 14vh, 7.5rem)";
      } else {
        wordDisplay.style.fontSize = "clamp(2rem, 10vh, 5.5rem)";
      }
    }

    function handleCorrect() {
      if (currentWordIndex < currentWords.length) {
        gameResults.push({
          word: currentWords[currentWordIndex],
          status: 'correct'
        });
        currentWordIndex++;
        showNextWord();
      }
    }

    function handlePass() {
      if (currentWordIndex < currentWords.length) {
        gameResults.push({
          word: currentWords[currentWordIndex],
          status: 'pass'
        });
        currentWordIndex++;
        showNextWord();
      }
    }

    function endGame() {
      clearInterval(timerInterval);

      completedSets.add(currentSetIndex);
      saveStorage();

      screenGame.classList.add('hidden');
      screenGame.classList.remove('flex');
      
      screenResult.classList.remove('hidden');
      screenResult.classList.add('flex');

      const correctCount = gameResults.filter(r => r.status === 'correct').length;
      resultScore.innerText = correctCount;

      resultWordList.innerHTML = '';
      gameResults.forEach((res, idx) => {
        const item = document.createElement('div');
        const isCorrect = res.status === 'correct';
        item.className = `flex justify-between items-center p-2 rounded-lg border ${
          isCorrect 
            ? 'bg-emerald-950/40 border-emerald-800/50 text-emerald-200' 
            : 'bg-rose-950/30 border-rose-900/40 text-rose-300'
        }`;
        
        item.innerHTML = `
          <span class="truncate font-medium"><span class="text-slate-500 mr-1">${idx+1}.</span>${res.word}</span>
          ${isCorrect 
            ? '<span class="bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded text-[10px] font-bold"><i class="fa-solid fa-check"></i> 정답</span>' 
            : '<span class="bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded text-[10px] font-bold"><i class="fa-solid fa-xmark"></i> 패스</span>'
          }
        `;
        resultWordList.appendChild(item);
      });
    }

    function showHomeScreen() {
      screenResult.classList.add('hidden');
      screenResult.classList.remove('flex');

      screenHome.classList.remove('hidden');
      screenHome.classList.add('flex');

      if (currentSetIndex < 49) {
        currentSetIndex++;
      }
      renderSetGrid();
      updateSelectedSetUI();
    }

    window.addEventListener('keydown', (e) => {
      if (!screenGame.classList.contains('hidden')) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
          handleCorrect();
        } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
          handlePass();
        }
      }
    });
  </script>
